[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-project-graph"
version = "0.2.0"
description = "Reusable Codex skill for compact repository graph artifacts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpenAI Codex" }]
license = { text = "MIT" }

[project.scripts]
project-graph = "project_graph.__main__:main"

[tool.setuptools.packages.find]
include = ["project_graph*", "scripts*"]
